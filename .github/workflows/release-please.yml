name: release-please

# Keeps a release pull request open against main while there are releasable
# changes. It bumps ActiveRecord::MysqlRgeo::VERSION, pins it in Gemfile.lock
# and adds it to docs/CHANGELOG.md, worked out from the Conventional Commit
# titles merged since the last release. Merging it tags the release
# v<version> and creates its GitHub Release, and the tag's push publishes the
# gem through .github/workflows/activerecord-mysql-rgeo.yml.
#
# It runs as the release GitHub App, not GITHUB_TOKEN: a pull request or tag
# GITHUB_TOKEN creates starts no workflows, so the release pull request would
# never get its checks and the tag would never publish the gem. The App's key
# is in the release environment, which only main can deploy to, so no run from
# another branch or a tag can read it.
#
# release-please only updates Gemfile.lock, so a second job pins the new
# version in the Appraisal lockfiles. See .github/scripts/pin-lockfile-versions.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    environment: release
    outputs:
      branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  pin-lockfiles:
    name: Pin the new version in the lockfiles
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          persist-credentials: false
      - name: Pin the new version in the lockfiles
        run: .github/scripts/pin-lockfile-versions "$BRANCH"
        env:
          BRANCH: ${{ needs.release-please.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
